<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Requests | Admin</title><style>body{font-family:system-ui,Arial;background:#f3f6fc;color:#17264d;margin:0;padding:24px}main{max-width:980px;margin:auto}section{background:white;padding:20px;border-radius:16px;box-shadow:0 8px 25px #14274b12;margin-bottom:18px}input,button{padding:12px;border:1px solid #d8e1f0;border-radius:10px;font:inherit}button{background:#0757e8;color:white;font-weight:700;cursor:pointer}form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px}.request{border:1px solid #e5ebf5;border-radius:12px;padding:16px;margin:12px 0}.muted{color:#64718c;font-size:13px}.error{color:#b42318}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>Project Requests</h1><section><p class="muted">Enter the ADMIN_KEY configured in Vercel. It is not stored in this page.</p><form id="login"><input id="key" type="password" autocomplete="off" placeholder="Admin key" required><button>Load requests</button></form><p id="status"></p></section><div id="list"></div></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status'),list=document.getElementById('list');status.textContent='Loading…';list.innerHTML='';try{const r=await fetch('/api/admin-requests',{headers:{'x-admin-key':document.getElementById('key').value}});if(!r.ok)throw new Error(r.status===401?'Incorrect admin key or missing configuration.':'Could not load requests.');const rows=await r.json();status.textContent=`Loaded ${rows.length} request(s).`;rows.forEach(x=>{const card=document.createElement('section');card.className='request';const h=document.createElement('h3');h.textContent=`${x.reference} — ${x.name} (${x.service})`;const meta=document.createElement('p');meta.className='muted';meta.textContent=`${x.created_at||''} · Budget: ${x.budget||'Not decided'} · Timeline: ${x.timeline||'Flexible'}`;const d=document.createElement('pre');d.textContent=x.details;card.append(h,meta,d);list.appendChild(card)});if(!rows.length)list.textContent='No requests found yet.'}catch(err){status.className='error';status.textContent=err.message}});</script></body></html>
